<!doctype html>
<html lang="en" style="font-size: 20px">
<head>
<style>
body.message { margin: 0; font-family: Arial, sans-serif; color: #202124; }
.card { box-sizing: border-box; max-width: 640px; margin: 12px auto; padding: 32px; border: 1px solid #dadce0; border-radius: 24px; }
h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 20px; }
.button { display: inline-block; padding: 12px 24px; border-radius: 999px; background: #0b57d0; color: white; text-decoration: none; font-weight: 700; }
.panel { margin-top: 24px; padding: 24px; background: #f1f3f4; border-radius: 16px; }
.panel h2 { font-size: 20px; font-weight: 700; margin-top: 0; }
table { width: 100%; border-collapse: collapse; }
td { padding: 8px; border-bottom: 1px solid #dadce0; }
@media (max-width: 500px) { .card { padding: 16px; margin: 0; } }
</style>
</head>
<body class="message" id="message-paper">
<div class="card">
<h1>Synthetic meeting notes</h1>
<p>This fictional message verifies authored browser layout, not a sender-specific workaround.</p>
<a class="button" href="https://example.org/notes">Open sample notes</a>
<div class="panel"><h2>Summary</h2><p>A gray panel, bold headings, rounded button and a constrained card.</p>
<table><tr><td>Design</td><td>Preserve original layout</td></tr><tr><td>Safety</td><td>Scripts disabled</td></tr></table>
</div>
</div>
</body>
</html>
